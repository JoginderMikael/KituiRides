services:
  postgres:
    image: postgres:16
    container_name: kituirides-postgres
    environment:
      POSTGRES_DB: kituirides
      POSTGRES_USER: kituirides
      POSTGRES_PASSWORD: kituirides
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kituirides -d kituirides"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: kituirides-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  kafka:
    image: apache/kafka:3.7.0
    container_name: kituirides-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  backend:
    build: ./backend
    container_name: kituirides-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/kituirides
      DB_USERNAME: kituirides
      DB_PASSWORD: kituirides
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      APP_KAFKA_ENABLED: ${APP_KAFKA_ENABLED:-false}
      FILE_UPLOAD_DIR: /app/uploads
      APP_MPESA_BASE_URL: "${APP_MPESA_BASE_URL:-https://sandbox.safaricom.co.ke}"
      APP_MPESA_SHORTCODE: "${APP_MPESA_SHORTCODE:-174379}"
      APP_MPESA_PASSKEY: "${APP_MPESA_PASSKEY:-sandbox-passkey}"
      APP_MPESA_CALLBACK_URL: "${APP_MPESA_CALLBACK_URL:-https://example.com/api/payments/mpesa/callback}"
      APP_MPESA_CONSUMER_KEY: "${APP_MPESA_CONSUMER_KEY:-sandbox-key}"
      APP_MPESA_CONSUMER_SECRET: "${APP_MPESA_CONSUMER_SECRET:-sandbox-secret}"
      APP_MPESA_TRANSACTION_TYPE: "${APP_MPESA_TRANSACTION_TYPE:-CustomerPayBillOnline}"
      APP_MPESA_SIMULATED: "${APP_MPESA_SIMULATED:-true}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "0.0.0.0:4050:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 1G

  frontend:
    build:
      context: ./frontend
      args:
        BUILD_VITE_GOOGLE_MAPS_API_KEY: "${VITE_GOOGLE_MAPS_API_KEY:-}"
    container_name: kituirides-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "0.0.0.0:5174:80"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  pgdata:
  backend_uploads:
