services:
  postgres:
    image: postgres:16
    container_name: kituirides-postgres
    environment:
      POSTGRES_DB: kituirides
      POSTGRES_USER: kituirides
      POSTGRES_PASSWORD: kituirides
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kituirides -d kituirides"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: kituirides-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: kituirides-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/kituirides
      DB_USERNAME: kituirides
      DB_PASSWORD: kituirides
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build: ./frontend
    container_name: kituirides-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  pgdata:
