server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kituirides}
    username: ${DB_USERNAME:kituirides}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:kituirides-api}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.kituirides.api.event.*
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

file:
  upload:
    dir: ${FILE_UPLOAD_DIR:uploads}

app:
  kafka:
    enabled: ${APP_KAFKA_ENABLED:false}
    topics:
      ride-events: ${APP_KAFKA_RIDE_EVENTS_TOPIC:kituirides.ride-events}
      payment-events: ${APP_KAFKA_PAYMENT_EVENTS_TOPIC:kituirides.payment-events}
      driver-location-events: ${APP_KAFKA_DRIVER_LOCATION_EVENTS_TOPIC:kituirides.driver-location-events}
      notification-events: ${APP_KAFKA_NOTIFICATION_EVENTS_TOPIC:kituirides.notification-events}
      support-events: ${APP_KAFKA_SUPPORT_EVENTS_TOPIC:kituirides.support-events}
      analytics-events: ${APP_KAFKA_ANALYTICS_EVENTS_TOPIC:kituirides.analytics-events}
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  superadmin:
    email: ${APP_SUPERADMIN_EMAIL:}
    password: ${APP_SUPERADMIN_PASSWORD:}
    first-name: ${APP_SUPERADMIN_FIRST_NAME:Super}
    last-name: ${APP_SUPERADMIN_LAST_NAME:Admin}
    phone: ${APP_SUPERADMIN_PHONE:}
  mpesa:
    base-url: ${APP_MPESA_BASE_URL:https://sandbox.safaricom.co.ke}
    shortcode: ${APP_MPESA_SHORTCODE:174379}
    passkey: ${APP_MPESA_PASSKEY:sandbox-passkey}
    callback-url: ${APP_MPESA_CALLBACK_URL:https://example.com/api/payments/mpesa/callback}
    consumer-key: ${APP_MPESA_CONSUMER_KEY:sandbox-key}
    consumer-secret: ${APP_MPESA_CONSUMER_SECRET:sandbox-secret}
    transaction-type: ${APP_MPESA_TRANSACTION_TYPE:CustomerPayBillOnline}
    simulated: ${APP_MPESA_SIMULATED:true}

logging:
  level:
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

chat:
  auto-close:
    fixed-delay-ms: 300000
