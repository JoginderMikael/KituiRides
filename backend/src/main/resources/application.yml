server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kituirides}
    username: ${DB_USERNAME:kituirides}
    password: ${DB_PASSWORD:kituirides}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

file:
  upload:
    dir: ${FILE_UPLOAD_DIR:uploads}

app:
  jwt:
    secret: replace-with-at-least-32-random-characters
    expiration-ms: 86400000
  mpesa:
    shortcode: "174379"
    passkey: "sandbox-passkey"
    callback-url: "https://example.com/api/payments/mpesa/callback"
    consumer-key: "sandbox-key"
    consumer-secret: "sandbox-secret"

logging:
  level:
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

chat:
  auto-close:
    fixed-delay-ms: 300000
